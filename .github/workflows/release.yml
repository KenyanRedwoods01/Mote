name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title'
        required: false
        default: 'Mote v1.0.0 — Hybrid On-Device & Cloud AI Assistant'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (API 36 & Build Tools)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build keystores & Firebase config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add a GitHub Actions secret named GOOGLE_SERVICES_JSON containing the raw contents of your Firebase app/google-services.json (or GOOGLE_SERVICES_JSON_BASE64)."
            exit 1
          fi

      - name: Resolve release tag & version metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="${{ github.event.inputs.release_name }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE="Mote ${TAG}"
            PRERELEASE="false"
            if [[ "$TAG" == *"-"* ]]; then
              PRERELEASE="true"
            fi
          fi
          if [ -z "$TITLE" ]; then
            TITLE="Mote ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Align & Sign Release APK
        id: sign
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          RAW_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -z "$RAW_APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi

          mkdir -p release-artifacts
          ALIGNED_APK="release-artifacts/aligned.apk"
          SIGNED_APK="release-artifacts/mote-${TAG}-release.apk"

          "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED_APK"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            KEY_PASS="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass "pass:${RELEASE_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${RELEASE_KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            rm -f release.keystore
            echo "signing_mode=Production Release Keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; signing release APK with fallback project keystore."
            "$APKSIGNER" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            echo "signing_mode=Fallback Project Keystore (configure RELEASE_KEYSTORE_* secrets for Play/production signing)" >> "$GITHUB_OUTPUT"
          fi

          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          rm -f "$ALIGNED_APK"

          (cd release-artifacts && sha256sum "mote-${TAG}-release.apk" > SHA256SUMS.txt)
          ls -lh release-artifacts/
          echo "apk_path=${SIGNED_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mote-${{ steps.meta.outputs.tag }}-release-apk
          path: |
            ${{ steps.sign.outputs.apk_path }}
            release-artifacts/SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Mote Android Release (`${{ steps.meta.outputs.tag }}`)

            - **APK:** `mote-${{ steps.meta.outputs.tag }}-release.apk`
            - **Min SDK:** Android 8.0 (API 26) · **Target SDK:** Android 16 (API 36)
            - **Signing:** ${{ steps.sign.outputs.signing_mode }}
            - **Integrity:** Verify download against attached `SHA256SUMS.txt`

            See [`CHANGELOG.md`](./CHANGELOG.md) for the full list of features and fixes.
          files: |
            ${{ steps.sign.outputs.apk_path }}
            release-artifacts/SHA256SUMS.txt
